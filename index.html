<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NUMdropper</title>
</head>
<body>
    
   <div class="container">
    <div class="one"><h1>NUM</h1></div><div class="two"><h1>dropping</h1></div>
   </div>
   <div id="trans">
   <div class="ta"><h3>TOTAL ADDITION : </h3><p id="tap">0</p></div>
    <div class="ta"><h3>HIGHEST : </h3><p id="hp">0</p></div> 
    <button class="ca" onclick="clearall()">clear all</button>
    </div>
    <button id="add" onclick="add()">ADD</button>
<style>
/* Centering body fix for mobile */
body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    min-height: 100vh;
    margin: 0;
    padding-top: 40px;
    box-sizing: border-box;
}

.ca{
    border-radius: 10px;
}
.container{
    border-color: black;
    border-style: solid;
    border-width: 5px;
    display: inline-flex;
    padding:0px;
    margin-bottom: 40px; /* Switched margin-left to standard bottom spacing */
}
   .one{
    display: inline-block;
    background-color: black;
    color:white;
    font-weight: 200;
    padding-right:20px ;
    padding-left:20px ;
    padding-top:1px ;
    padding-bottom:1px ;
   } 
   .two{
    display:inline-block;
    padding-left:50px;
    padding-right:50px;
    padding-top:1px;
    padding-bottom: 1px;
   }
   /* Reset standard H1 margins to stop top pushing */
   .container h1 {
    margin: 10px 0;
   }
   h3{
    display:inline;
   }
   p{
    display:inline;
   }
   .ta{
    margin: 20px 0;
    text-align: center;
    letter-spacing: 0.5px;
   }
   
   #trans{
    width:250px;
    height:250px;
    display:flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif ;
    border-radius: 25px;
    background-color: yellow;
    margin-bottom: 40px; /* Switched margin-left/top to standard bottom spacing */
    box-shadow: 5px 7px 15px cyan,-5px -7px 15px cyan;
   }
   #add{
    padding:20px;
    border-radius: 15px;
   }
</style>
<script>
 let totalhere =document.getElementById("tap");
 let highesthere=document.getElementById("hp");
 let total=Number(localStorage.getItem("total"));
 let highest=Number(localStorage.getItem("highest"));
 totalhere.textContent=total || 0;
 highesthere.textContent=highest ||0 ;

function clearall(){
localStorage.clear();
totalhere.textContent=0;
highesthere.textContent=0;
}
 function add(){
    window.location.href="addition.html";
 }
</script>    
</body>
</html>
